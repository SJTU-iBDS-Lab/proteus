; Python logging.config.fileConfig — controls human-readable progress
; logs for `scripts/red_team/run_evolution.py`.
;
; Two handlers:
;   * console — stderr, brief format (HH:MM:SS LEVEL | message), INFO+
;   * file    — path from $LOG_FILE env var (default: /tmp/claw_run.log),
;               detailed format with module name, DEBUG+, rotated at 10MB
;
; Override LOG_FILE per run, or rely on the runner's
; ``attach_run_file_handler`` which also dumps a per-run copy under
; ``<run_dir>/run.log`` automatically.

[loggers]
keys=root,red_team,sandbox,blue_team,httpx,httpcore,openai,litellm

[handlers]
keys=console,file

[formatters]
keys=brief,detailed

; ---------------- loggers ----------------

[logger_root]
level=INFO
handlers=console,file

[logger_red_team]
level=DEBUG
handlers=
qualname=red_team
propagate=1

[logger_sandbox]
level=DEBUG
handlers=
qualname=sandbox
propagate=1

[logger_blue_team]
level=DEBUG
handlers=
qualname=blue_team
propagate=1

; ---------------- third-party noise filters ----------------
; ``HTTP Request: POST ... 200 OK`` lines from openai SDK / httpx /
; httpcore drown out the actual LLM input/output.  Keep them at
; WARNING so connection errors still surface, but the per-request
; INFO chatter is silenced.

[logger_httpx]
level=WARNING
handlers=
qualname=httpx
propagate=1

[logger_httpcore]
level=WARNING
handlers=
qualname=httpcore
propagate=1

[logger_openai]
level=WARNING
handlers=
qualname=openai
propagate=1

[logger_litellm]
level=WARNING
handlers=
qualname=LiteLLM
propagate=1

; ---------------- handlers ----------------

[handler_console]
class=StreamHandler
level=INFO
formatter=brief
args=(sys.stderr,)

[handler_file]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=detailed
args=(__import__('os').environ.get('LOG_FILE', '/tmp/claw_run.log'), 'a', 10485760, 3, 'utf-8')

; ---------------- formatters ----------------

[formatter_brief]
format=%(asctime)s %(levelname)-7s | %(message)s
datefmt=%H:%M:%S

[formatter_detailed]
format=%(asctime)s %(levelname)-7s %(name)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S
